name: Update Timetable

on:
  workflow_dispatch:

jobs:
  update-timetable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run timetable updater
        env:
          SCHOOL_USERNAME: ${{ secrets.SCHOOL_USERNAME }}
          SCHOOL_PASSWORD: ${{ secrets.SCHOOL_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          TIMETABLE_SEMESTER: ${{ secrets.TIMETABLE_SEMESTER }}
          CRAWLER_WEEKS_AHEAD: 2
          CALENDAR_COLOR_EXAM: 11
          CALENDAR_COLOR_CLASS: 2
          CALENDAR_COLOR_GRAPHITE: 8
          CALENDAR_COLOR_BASIL: 10
        run: |
          python main.py --sync
